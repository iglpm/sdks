name: Build and Release SDKs

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Target to build (empty: build all targets)"
        required: false
        default: ""
      release:
        description: "Create or update GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sdk-builds-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan SDK Builds
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - id: set-matrix
        name: Generate target matrix
        run: |
          TARGET="${{ github.event.inputs.target }}"
          if [ -n "$TARGET" ]; then
            echo "matrix={\"target\":[\"$TARGET\"]}" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"target\":[\
              \"x86_64-unknown-linux-gnu\",\
              \"i686-unknown-linux-gnu\",\
              \"aarch64-unknown-linux-gnu\",\
              \"armv7-unknown-linux-gnueabihf\",\
              \"arm-unknown-linux-gnueabi\",\
              \"riscv64gc-unknown-linux-gnu\",\
              \"powerpc64le-unknown-linux-gnu\",\
              \"powerpc64-unknown-linux-gnu\",\
              \"powerpc-unknown-linux-gnu\",\
              \"s390x-unknown-linux-gnu\",\
              \"sparc64-unknown-linux-gnu\",\
              \"loongarch64-unknown-linux-gnu\",\
              \"x86_64-unknown-linux-musl\",\
              \"i686-unknown-linux-musl\",\
              \"aarch64-unknown-linux-musl\",\
              \"armv7-unknown-linux-musleabihf\",\
              \"arm-unknown-linux-musleabihf\",\
              \"riscv64gc-unknown-linux-musl\",\
              \"powerpc64le-unknown-linux-musl\",\
              \"x86_64-pc-windows-gnu\",\
              \"i686-pc-windows-gnu\",\
              \"x86_64-pc-windows-gnullvm\",\
              \"aarch64-pc-windows-gnullvm\",\
              \"x86_64-pc-windows-msvc\",\
              \"aarch64-pc-windows-msvc\",\
              \"i686-pc-windows-msvc\",\
              \"aarch64-linux-android\",\
              \"armv7-linux-androideabi\",\
              \"x86_64-linux-android\",\
              \"i686-linux-android\",\
              \"x86_64-unknown-freebsd\"\
            ]}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Build SDK tarball
        run: |
          mkdir -p dist
          ./builders/build-target.sh "${{ matrix.target }}" dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ matrix.target }}
          path: dist/${{ matrix.target }}.tar.xz
          retention-days: 7

  build-macos:
    name: Build macOS SDK (osxcross approach)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Package macOS SDK
        run: |
          mkdir -p dist
          ./builders/build-macos.sh "MacOSX.sdk" dist

      - name: Upload macOS SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-macos
          path: dist/*.tar.xz
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release == 'true'
    needs: [build, build-macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all SDK artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create / Update Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.xz
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
